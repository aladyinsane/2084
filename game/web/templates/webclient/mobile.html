{% load static %}
<!DOCTYPE HTML>
<html dir="ltr" lang="en">
<head>
  <title>{{ game_name }} — mobile</title>
  <meta http-equiv="content-type" content="application/xhtml+xml; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="/static/website/images/evennia_logo.png" />

  <link rel="stylesheet" type="text/css" media="screen" href={% static "webclient/css/webclient.css" %}>

  <style>
    /* Phase 1 of the mobile client (docs/research/mobile-web-client.md):
       one scrolling output pane, one fixed input bar, no panes to drag.
       webclient.css (loaded above) already supplies the color-NNN palette,
       #messagewindow scrolling, and #input's fixed-to-bottom behavior —
       this just lays out the parts that were GoldenLayout's job before. */
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      overscroll-behavior: none;
    }
    /* webclient.css shrinks body text under 480px width — sized for a
       GoldenLayout pane squeezed on a small screen, not for a client that
       IS the screen. Override it: this rule comes later in the cascade
       and matches unconditionally, so it wins regardless of viewport. */
    body {
      font-size: 1rem;
      line-height: 1.4;
    }
    /* default_out.js's onText falls back to a bare `cls` variable that's
       `undefined` (not the string "out") for any message sent with
       options but no explicit `cls` key — e.g. `map`'s {"type": "map"}.
       On the desktop client GoldenLayout intercepts those before they
       reach here; we don't load GoldenLayout, so they land as
       <div class="undefined">, missing `.out`'s white-space: pre-wrap
       and collapsing the map's column-aligning spaces. Apply it to every
       output line regardless of class. */
    #messagewindow > div {
      white-space: pre-wrap;
    }
    #titlebar {
      position: fixed;
      top: 0; left: 0; width: 100%;
      box-sizing: border-box;
      padding: .5rem .75rem;
      background: #111;
      color: #a6a6a6;
      font-size: .85rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      border-bottom: 1px solid #333;
      z-index: 2;
    }
    #output-wrap {
      position: fixed;
      top: 2.2rem; left: 0; width: 100%;
      bottom: 6.5rem;
      overflow-y: auto;
      overflow-x: hidden;
      box-sizing: border-box;
      padding: .5rem .75rem;
      -webkit-overflow-scrolling: touch;
    }
    #quickbar {
      position: fixed;
      bottom: 4.5rem; left: 0; width: 100%;
      box-sizing: border-box;
      display: flex;
      gap: .4rem;
      overflow-x: auto;
      padding: .4rem .75rem;
      background: #0a0a0a;
      border-top: 1px solid #222;
      z-index: 2;
    }
    #quickbar button {
      flex: none;
      background: #1a1a1a;
      color: #ccc;
      border: 1px solid #333;
      border-radius: .3rem;
      padding: .3rem .7rem;
      font-family: inherit;
      font-size: .85rem;
    }
    #quickbar button:active { background: #2a2a2a; }
    /* Compass D-pad: floats over the right edge of the output pane so
       movement doesn't cost screen real estate the way a full-width bar
       would. N/S/E/W get the cardinal cross; up/down sit in the corners
       the cross doesn't use. */
    #compass {
      position: fixed;
      right: .6rem;
      bottom: 7.8rem;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, 2.3rem);
      grid-template-rows: repeat(3, 2.3rem);
      gap: .3rem;
      opacity: .88;
    }
    #compass button {
      background: rgba(26, 26, 26, 0.9);
      color: #ccc;
      border: 1px solid #333;
      border-radius: .3rem;
      font-family: inherit;
      font-size: 1rem;
      padding: 0;
    }
    #compass button:active { background: #2a2a2a; }
    #compass .dir-n { grid-column: 2; grid-row: 1; }
    #compass .dir-w { grid-column: 1; grid-row: 2; }
    #compass .dir-e { grid-column: 3; grid-row: 2; }
    #compass .dir-s { grid-column: 2; grid-row: 3; }
    #compass .dir-u { grid-column: 1; grid-row: 1; font-size: .8rem; color: #888; }
    #compass .dir-d { grid-column: 3; grid-row: 3; font-size: .8rem; color: #888; }
    #input {
      height: 4.5rem;
    }
    #inputform {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .prompt {
      flex: none;
      padding: 0 .75rem;
      font-size: .85rem;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #inputcontrol {
      display: flex;
      flex: 1;
      padding: 0 .5rem .5rem;
      gap: .4rem;
    }
    #inputfield {
      flex: 1;
      border: 1px solid #333;
      border-radius: .3rem;
    }
    #inputsend {
      flex: none;
      width: 3.5rem;
      border: 1px solid #333;
      border-radius: .3rem;
      background: #1a1a1a;
      color: #fff;
      font-size: 1.2rem;
    }
  </style>

  <script language="javascript" type="text/javascript">
    {% if websocket_enabled %}
      var wsactive = true;
    {% else %}
      var wsactive = false;
    {% endif %}

    {% if browser_sessid %}
      var csessid = "{{ browser_sessid }}";
    {% else %}
      var csessid = false;
    {% endif %}

    {% if websocket_url %}
      var wsurl = "{{ websocket_url }}";
    {% else %}
      var wsurl = "ws://" + this.location.hostname + ":{{ websocket_port }}";
    {% endif %}

    function generateUID() {
        return Math.random().toString(36).substring(2, 15) +
            Math.random().toString(36).substring(2, 15);
    }
    var cuid = generateUID();
  </script>

  <!-- jQuery: evennia.js and the plugin files below still bind through it. -->
  <script src="https://code.jquery.com/jquery-3.2.1.min.js" integrity="sha384-xBuQ/xzmlsLoJpyjoggmTEz8OWUFM0/RC5BsqQBDX2v5cMvDHcMakNTNrHIW2I5f" crossorigin="anonymous"></script>

  <!-- The protocol layer: identical to the desktop client, no GoldenLayout. -->
  <script src={% static "webclient/js/evennia.js" %} type="text/javascript" charset="utf-8"></script>
  <script src={% static "webclient/js/webclient_gui.js" %} type="text/javascript" charset="utf-8"></script>
  <script src={% static "webclient/js/plugins/default_in.js" %} type="text/javascript" charset="utf-8"></script>
  <script src={% static "webclient/js/plugins/default_out.js" %} type="text/javascript" charset="utf-8"></script>
</head>
<body>
  <div id="titlebar">{{ game_name }}</div>

  <div id="output-wrap">
    <div id="output-sub">
      <div id="messagewindow"></div>
    </div>
  </div>

  <div id="compass">
    <button type="button" class="dir-u" data-cmd="up" aria-label="Up">&#9650;</button>
    <button type="button" class="dir-n" data-cmd="north" aria-label="North">N</button>
    <button type="button" class="dir-w" data-cmd="west" aria-label="West">W</button>
    <button type="button" class="dir-e" data-cmd="east" aria-label="East">E</button>
    <button type="button" class="dir-s" data-cmd="south" aria-label="South">S</button>
    <button type="button" class="dir-d" data-cmd="down" aria-label="Down">&#9660;</button>
  </div>

  <div id="quickbar">
    <button type="button" data-cmd="look">look</button>
    <button type="button" data-cmd="map">map</button>
    <button type="button" data-cmd="next">next</button>
    <button type="button" data-cmd="errands">errands</button>
    <button type="button" data-cmd="dossier">dossier</button>
  </div>

  <div id="input">
    <div id="inputform">
      <div id="prompt" class="prompt"></div>
      <div id="inputcontrol">
        <textarea id="inputfield" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        <button type="button" id="inputsend">&gt;</button>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    document.querySelectorAll("#quickbar button, #compass button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        plugin_handler.onSend(btn.getAttribute("data-cmd"));
      });
    });
  </script>
</body>
</html>
